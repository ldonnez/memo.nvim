name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install commitlint
        run: npm install -D @commitlint/cli @commitlint/config-conventional
      - name: Print versions
        run: |
          git --version
          node --version
          npm --version
          npx commitlint --version

      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  stylua:
    needs: commitlint
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  emmylua_check:
    needs: stylua
    name: emmylua_check
    runs-on: ubuntu-latest
    steps:
      - name: Setup neovim
        shell: bash
        run: |
          set -euo pipefail
          dest="$HOME/nvim-stable"
          curl -fsSL "https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz" -o /tmp/nvim.tar.gz
          mkdir -p "$dest"
          tar -xzf /tmp/nvim.tar.gz -C "$dest" --strip-components=1
          echo "$dest/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - name: Setup emmylua_check
        run: make deps/emmylua_check

      - name: Run emmylua_check
        run: ./deps/emmylua/emmylua_check . --config ./.emmyrc.json
        env:
          VIMRUNTIME: /home/runner/nvim-stable/share/nvim/runtime

  test:
    needs: emmylua_check
    timeout-minutes: 4
    strategy:
      matrix:
        os: [ubuntu-latest]
        neovim_version: ["stable", "nightly"]
        include:
          - os: macos-latest
            neovim_version: stable
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup neovim
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}-$(uname -m)" in
            Linux-x86_64) asset="nvim-linux-x86_64.tar.gz" ;;
            Linux-aarch64) asset="nvim-linux-arm64.tar.gz" ;;
            macOS-arm64) asset="nvim-macos-arm64.tar.gz" ;;
            macOS-x86_64) asset="nvim-macos-x86_64.tar.gz" ;;
            *) echo "Unsupported platform: ${{ runner.os }} $(uname -m)" >&2; exit 1 ;;
          esac
          dest="$HOME/nvim-${{ matrix.neovim_version }}"
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${{ matrix.neovim_version }}/${asset}" -o /tmp/nvim.tar.gz
          mkdir -p "$dest"
          tar -xzf /tmp/nvim.tar.gz -C "$dest" --strip-components=1
          echo "$dest/bin" >> "$GITHUB_PATH"

      - name: Setup mini.nvim
        run: make deps/mini.nvim

      - name: Setup memo
        run: make deps/memo

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run tests
        run: make test
